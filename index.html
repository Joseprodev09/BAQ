<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Simulador del recorrido de las rutas troncales R1 y B1 de Transmetro en Barranquilla, con hoteles cercanos y señalización para turistas."
    />
    <title>BAQ360 · Simulador Transmetro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Archivo:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/estilos.css" />
    <link rel="icon" type="image/png" href="assets/baq360.png" />
  </head>
  <body>
    <header class="band top">
      <div class="marca">
        <img class="logo" src="assets/baq360.png" alt="BAQ360" width="150" height="85" />
        <div>
          <h1 data-i18n="titulo">Simulador de recorrido Transmetro · Barranquilla</h1>
          <p data-i18n="intro"></p>
        </div>
      </div>
      <!-- Herramientas: modo oscuro e idioma (esquina superior derecha) -->
      <div class="herramientas">
        <button class="chip icono" id="tema" type="button" aria-pressed="false">
          <svg class="luna" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
          <svg
            class="sol"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="4.5" />
            <path
              d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"
            />
          </svg>
          <span id="temaTx"></span>
        </button>
        <label class="selector-idioma">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="9.5" />
            <path d="M2.5 12h19M12 2.5c2.8 3 2.8 16 0 19M12 2.5c-2.8 3-2.8 16 0 19" />
          </svg>
          <span class="sr" data-i18n="idioma"></span>
          <select id="idioma">
            <option value="es">Español</option>
            <option value="en">English</option>
            <option value="pt">Português</option>
          </select>
        </label>
      </div>
    </header>

    <div class="band ctl selector-ruta">
      <label class="lbl" for="ruta" style="margin: 0" data-i18n="ruta"></label>
      <select id="ruta"></select>
    </div>

    <section class="band app">
      <div>
        <div class="mapbox">
          <svg id="map" role="img" data-i18n-aria="mapaAria"></svg>
          <div class="mapctl">
            <button class="chip" id="cFollow" aria-pressed="true" data-i18n="seguir"></button>
            <button class="chip" id="cAll" aria-pressed="false" data-i18n="verTodo"></button>
            <button class="chip" id="zin" data-i18n-aria="acercar">+</button>
            <button class="chip" id="zout" data-i18n-aria="alejar">−</button>
          </div>
        </div>
        <div class="legend">
          <span><i id="lgR" style="background: var(--r1)"></i><span id="lgRt"></span></span
          ><span><i style="background: #fff; border: 2px solid #17202a"></i><span data-i18n="lgEstacion"></span></span
          ><span><i style="background: #3b5bdb"></i><span data-i18n="lgHotel"></span></span
          ><span><i style="background: var(--warn)"></i><span data-i18n="lgSiguiente"></span></span
          ><span><i style="background: #2e7d4f"></i><span data-i18n="lgVisitado"></span></span
          ><span data-i18n="lgDatos"></span>
        </div>
      </div>
      <aside class="side" aria-live="polite">
        <div class="card">
          <p class="lbl" data-i18n="dirActual"></p>
          <div class="big" id="dir">—</div>
          <div class="sub" id="dir2">—</div>
        </div>
        <div class="card">
          <div class="hrow">
            <div class="hicon done">✓</div>
            <div>
              <p class="lbl" data-i18n="hotelLlegaron"></p>
              <div class="big" id="hNow">—</div>
              <div class="sub" id="hNow2">—</div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="hrow">
            <div class="hicon next">H</div>
            <div>
              <p class="lbl" data-i18n="siguienteHotel"></p>
              <div class="big" id="hNext">—</div>
              <div class="sub" id="hNext2">—</div>
            </div>
          </div>
        </div>
      </aside>
    </section>

    <section class="band controls" style="padding-top: 0">
      <div class="card">
        <div class="ctl" style="justify-content: space-between">
          <div class="seg" role="group" data-i18n-aria="modoAria">
            <button class="b" id="mAuto" aria-pressed="true" data-i18n="auto"></button>
            <button class="b" id="mMan" aria-pressed="false" data-i18n="manual"></button>
          </div>
          <div class="ctl">
            <button class="b" id="prev" data-i18n="anterior"></button>
            <button class="b pri" id="play"></button>
            <button class="b" id="next" data-i18n="siguiente"></button>
          </div>
          <div class="ctl">
            <label for="vel" class="lbl" style="margin: 0" data-i18n="velocidad"></label>
            <select id="vel">
              <option value="10">×10</option>
              <option value="30" selected>×30</option>
              <option value="60">×60</option>
              <option value="120">×120</option>
            </select>
            <button class="b" id="reset" data-i18n="reiniciar"></button>
          </div>
        </div>
        <input type="range" id="pos" min="0" max="1000" value="0" data-i18n-aria="posAria" />
        <div class="prog"><span id="pA">—</span><span id="pT">—</span><span id="pB">—</span></div>
        <p class="note" style="margin: 6px 0 0" data-i18n="ayudaControles"></p>
      </div>
      <div class="card">
        <p class="lbl" data-i18n="hotelesRecorrido"></p>
        <div class="hlist" id="hlist"></div>
        <p class="note" style="margin: 6px 0 0" data-i18n="notaCaminata"></p>
      </div>
    </section>

    <section class="band" style="padding-top: 0">
      <h2 data-i18n="senalTitulo"></h2>
      <div class="sign" id="sign">
        <div>
          <div class="route"><span class="badge" id="sBadge">R1</span><span id="sDest"></span></div>
          <div class="k" id="sK"></div>
          <div class="st" id="sSt">—</div>
          <div class="k" id="sK2" style="margin-top: 10px"></div>
          <div style="font-size: 18px" id="sDir">—</div>
          <div class="langs" role="group" data-i18n-aria="letreroAria">
            <button class="chip" data-l="es" aria-pressed="true">Español</button>
            <button class="chip" data-l="en" aria-pressed="false">English</button>
            <button class="chip" data-l="pt" aria-pressed="false">Português</button>
            <button class="chip" id="rot" aria-pressed="true" data-i18n="rotar"></button>
          </div>
        </div>
        <ul id="sList"></ul>
      </div>
      <p class="note" data-i18n="notaLetrero"></p>
    </section>

    <section class="band" style="padding-top: 0">
      <h2 data-i18n="mejorasTitulo"></h2>
      <div class="grid2" id="mejoras"></div>
    </section>

    <section class="band" style="padding-top: 0">
      <h2 data-i18n="fuentesTitulo"></h2>
      <!-- Los textos de las fuentes (con sus enlaces) están en js/textos-ui.js -->
      <ul class="src" id="fuentes"></ul>
    </section>

    <noscript
      ><p class="band">Este simulador necesita JavaScript activado. · This simulator needs JavaScript.</p></noscript
    >
    <p class="band note" id="errorCarga" hidden data-i18n-html="errorCarga"></p>

    <!-- Punto de entrada de la aplicación: js/main.js -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
